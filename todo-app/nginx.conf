events {
  worker_connections 1024;
}

http {
  server {
    listen 80;

    location = /api {
      proxy_pass http://todo-backend:3000/;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://todo-backend:3000/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://todo-frontend:80;
      proxy_set_header Host $host;
    }
  }
}
